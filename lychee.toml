# Markdown link checking
exclude_path = ["node_modules", "ideation", "docs/development", "build", ".test-build"]
exclude = [
  # npm answers automated requests with 403 whatever the page, so a check there proves nothing.
  "^https://www\\.npmjs\\.com/",
]
accept = [200, 206, 429]
max_retries = 2
timeout = 20
max_concurrency = 8
