name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
    validations: { required: true }

  - type: textarea
    attributes:
      label: Minimal reproduction
      description: The smallest PoseCamera config that shows the problem.
      render: tsx
    validations: { required: true }

  - type: input
    attributes:
      label: Device and OS version
      placeholder: Pixel 7a, Android 14
    validations: { required: true }

  - type: textarea
    attributes:
      label: getState() and getProfile() output
      description: '`console.log(cam.current?.getState(), await cam.current?.getProfile())`. Required for anything performance-related.'
      render: json

  - type: textarea
    attributes:
      label: Logs
      description: "Run with `setLogLevel('debug')` and paste the entries around the failure. See [the log channel](https://khalid999devs.github.io/react-native-pose-detection/troubleshooting#watching-it-work-the-log-channel)."
      render: text

  - type: dropdown
    attributes:
      label: Setup
      options: [Expo (dev build), Expo (EAS), Bare React Native]
    validations: { required: true }

  - type: input
    attributes:
      label: Package version
    validations: { required: true }

  - type: input
    attributes:
      label: React Native and Expo SDK versions
      placeholder: react-native 0.86.2, expo 57

  - type: dropdown
    attributes:
      label: Model
      options: [full, lite, heavy]

  - type: textarea
    attributes:
      label: doctor output
      description: '`npx react-native-pose-detection doctor`, run in the app root. Required for build and setup problems.'
      render: text
